[package]
name = "featherclick"
version = "0.1.0"
edition = "2024"
description = "A fast, tiny, cross-platform autoclicker with human-like randomisation"
license = "MIT"
repository = "https://github.com/DevanMetz/featherclick"
keywords = ["autoclicker", "automation", "cli", "mouse"]
categories = ["command-line-utilities", "gui"]

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
enigo = "0.6.1"
global-hotkey = "0.8.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target."cfg(target_os = \"linux\")".dependencies]
# X11 (x11rb, on by default) plus wlroots' virtual-pointer protocol, which is
# what Sway and Hyprland expose to native Wayland clients.
#
# enigo's libei backend (GNOME/KDE's RemoteDesktop portal) is deliberately NOT
# enabled: its portal client unwraps the connection result, so it aborts the
# process on any system without org.freedesktop.portal.Desktop - headless
# containers and minimal window managers included. Crashing on launch is worse
# than a documented limitation.
enigo = { version = "0.6.1", features = ["wayland"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Media", "Win32_System_Console", "Win32_Foundation", "Win32_UI_HiDpi"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
